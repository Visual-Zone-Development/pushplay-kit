name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run kit:install
      - run: node kit/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run lint
      - run: npm test

  # Every game repo's workflow calls the shared build at this tag, so it only moves to a commit on
  # main whose tests passed.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the tag game repos build with
        run: |
          ref=$(node -p "require('./kit/src/brand.json').buildRef")
          git tag -f "$ref"
          git push -f origin "refs/tags/$ref"
